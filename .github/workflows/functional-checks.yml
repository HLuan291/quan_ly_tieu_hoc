name: Functional checks

on:
  push:
    branches: [backend_audit_fix]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/functional-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: audit-root-only
          MYSQL_DATABASE: audit_school_ci
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -paudit-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://audit:audit-test-only@127.0.0.1:3306/audit_school_ci
      JWT_SECRET: test-only-ci-secret-with-enough-characters-2026
      AUDIT_ALLOW_TEST_DATA: '1'
      AUDIT_FIXTURE_FILE: /tmp/school-functional-fixture.json
      AUDIT_COMPLETE_FIXTURE_FILE: /tmp/school-complete-fixture.json
      AUDIT_REPORT_FILE: ${{ github.workspace }}/docs/ci-core-results.json
      FRONTEND_ORIGIN: http://localhost:5173
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci --include=dev
        working-directory: backend
      - name: Generate and validate Prisma
        working-directory: backend
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npx prisma db push --config prisma7.config.ts
      - name: Backend lint, build, unit and E2E
        working-directory: backend
        run: |
          npm run lint
          npm run build
          npm run test -- --runInBand
          npm run test:e2e -- --runInBand
      - name: Cold MySQL 8 RSA authentication
        working-directory: backend
        env:
          AUDIT_MYSQL_RSA_URL: mysql://audit_cold_rsa:audit-cold-rsa-test-only@127.0.0.1:3306/audit_school_ci
        run: |
          docker exec -e MYSQL_PWD=audit-root-only "${{ job.services.mysql.id }}" mysql --protocol=socket -u root -e "CREATE USER 'audit_cold_rsa'@'%' IDENTIFIED WITH caching_sha2_password BY 'audit-cold-rsa-test-only'; GRANT SELECT, UPDATE ON audit_school_ci.* TO 'audit_cold_rsa'@'%';"
          node scripts/mysql-rsa-auth-audit.cjs
      - name: Regenerate endpoint matrix
        working-directory: backend
        run: node scripts/audit-route-map.cjs
      - name: MySQL constraint and API regression
        working-directory: backend
        run: node scripts/assignment-constraint-audit.cjs
      - name: Complete authenticated API coverage
        working-directory: backend
        run: node scripts/functional-complete-audit.cjs
      - name: Student profiles and assessment permissions
        working-directory: backend
        run: node scripts/student-profile-audit.cjs
      - name: Attendance dates and teacher class scope
        working-directory: backend
        run: node scripts/scope-attendance-audit.cjs
      - name: Install frontend
        run: npm ci --include=dev
        working-directory: frontend
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm run test:dates
          node scripts/test-loi-api.cjs
          npm run lint
          npm run build
      - name: Dependency audit (all and production)
        if: always()
        working-directory: backend
        run: node scripts/dependency-audit.cjs
      - name: Install Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chromium functional forms
        working-directory: backend
        env:
          AUDIT_BROWSER_MODULES: ${{ runner.temp }}/browser-tools/node_modules
        run: node scripts/browser-functional-audit.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-evidence
          path: |
            docs/ci-*.json
            docs/assignment-constraint-audit-results.json
            docs/runtime-server.log
            docs/ci-extra-server.log
            docs/ci-profile-server.log
            docs/ci-scope-server.log
            docs/ci-browser/
          if-no-files-found: warn
          retention-days: 14
